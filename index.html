<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jungle Frog</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Miun</p>
          <h1>Jungle Frog</h1>
          <p class="subtitle">Hjälp grodan att nå nästa näckros.</p>
        </div>
        <div class="level-card">
          <span>Nivå</span><strong id="levelNumber">1</strong>
        </div>
        <div class="score-card">
          <span>Poäng</span>
          <strong id="score">0</strong>
        </div>
      </header>
      <section class="game-panel" aria-label="Spelområde">
        <canvas id="gameCanvas" width="1100" height="620"
          >Din webbläsare stöder inte canvas.</canvas
        >
      </section>
      <section class="controls" aria-label="Spelkontroller">
        <div class="prediction" aria-live="polite">
          <span>Spelmotor</span>
          <strong id="statusText">Spelmotorn vän tar...</strong>
        </div>
        <div class="jump-settings" aria-label="Hoppinställningar">
          <label class="slider-control" for="angleSlider">
            <span>Vinkel <output id="angleValue">45°</output></span>
            <input
              id="angleSlider"
              type="range"
              min="10"
              max="80"
              step="1"
              value="45"
            />
          </label>
          <label class="slider-control" for="speedSlider">
            <span>Starthastighet <output id="speedValue">9 m/s</output></span>
            <input
              id="speedSlider"
              type="range"
              min="4"
              max="14"
              step="1"
              value="9"
            />
          </label>
        </div>
        <button id="jumpButton" type="button">HOPPA!</button>
      </section>
    </main>
    <script src="js/physics.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/gameMap.js"></script>
    <script src="js/game.js"></script>
    <script src="js/input.js"></script>
  </body>
</html>
